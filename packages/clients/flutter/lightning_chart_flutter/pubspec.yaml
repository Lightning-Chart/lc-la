name: lightning_chart_flutter
description: Flutter charts powered by LightningChart, with binary transport for high-performance historical and real-time visualization.
version: 0.0.0
homepage: https://lightningchart.com
repository: https://github.com/lightningchart/lightningchart-la
issue_tracker: https://github.com/lightningchart/lightningchart-la/issues
topics:
  - charts
  - flutter
  - visualization
  - realtime
  - webgl

platforms:
  android:
  ios:
  macos:
  web:

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/lcla-host.js
